HIOnAIKP51pRadp21Boj7fGyovRZXfCV8PAAABr3qYhmCfe9Ry4KFNuq8j0nUhzaBX+rs4s14ucgUoYboRMaA07M0VqTYwNOyJn/MylcyVP1EqbDfFm04zZOnBwfoEYO+IJ/8W423XsM8CU6EQxhURsbGxsbGxsbGxsbGxsbGxsbGxsbGxsbGxsbGxsbGxsbGxsbGxsasrWIZaJXP28kJbcSeoN5AKbCwZnFFXNiMcuPjzaI9y/y+BOeyPUqKQ/+Tn4qIEVtIvvF5THgAAAAA==\" alt=\"Proposed positioning treatment, not a live Instagram change\"><figcaption><b>THE TREATMENT</b> / A proposed bio and positioning screen. Camera, founder, books and film in one story.</figcaption></figure></div><div class=\"oglinks\"><a class=\"ogbutton\" href=\"/social/varun-strategy-v39.html\">Explore the full case study \u2197</a></div><div class=\"oggrid\"><article class=\"ogcard\"><small>01 / PERCEPTION AUDIT</small><h3>Make the proof easy to find.</h3><p>Bio and search positioning | first-screen hierarchy | existing pins | new Highlight concepts.</p></article><article class=\"ogcard\"><small>02 / GROWTH ENGINE</small><h3>Give each format a job.</h3><p>Seven distinct carousel treatments | six Reel series | question hooks | captions | CTAs | broadcast examples.</p></article><article class=\"ogcard\"><small>03 / EXECUTION LAYER</small><h3>Test before scaling.</h3><p>Profile visit to follow | retention | saves and shares per reach | channel return | first-party baseline.</p></article></div><p class=\"ognote\">April 2026: original 53-page, three-volume strategy. September 2026: screenshot-led revision and unpublished mockups. This is strategy work, not a claim that Varun implemented it or that his account grew because of it.</p></section><section class=\"ognew\" id=\"social-strengths\"><span class=\"ogk\">SOCIAL MEDIA / WHAT I OPTIMIZE & HOW</span><h2>THE NUMBERS.<br>THE WORK BEHIND THEM.</h2><p class=\"oglead\">From a profile\u2019s first impression to a script\u2019s last line. I work on the parts that decide whether someone stops, stays, follows or takes the next step.</p><div class=\"oggrid\"><article class=\"ogcard\"><small>01 / FIRST IMPRESSION</small><h3>Profile &amp; search optimization</h3><p>I align the name field, bio, proof, pins, Highlights and link path so a first-time visitor knows who the account is for and why to stay.</p><p class=\"ognote\">Check: profile visits \u2192 follows \u2192 relevant link taps.</p></article><article class=\"ogcard\"><small>02 / HOOK ARCHITECTURE</small><h3>Earn the first few seconds.</h3><p>I build hooks around a specific question, a useful contradiction or a real scene. The opening promises one payoff, not five unrelated ideas.</p><p class=\"ognote\">Check: first-seconds retention and matched hook tests.</p></article><article class=\"ogcard\"><small>03 / RETENTION SCRIPTWRITING</small><h3>Keep the promise moving.</h3><p>I sequence setup, tension, evidence and payoff. Cut filler, use purposeful pattern changes and give each line a reason to lead to the next.</p><p class=\"ognote\">Check: audience drop-offs, average watch time and completion.</p></article><article class=\"ogcard\"><small>04 / TREND-ADAPTIVE CONCEPTS</small><h3>Use the trend. Keep the voice.</h3><p>I adapt a live format to the creator\u2019s actual expertise and audience. The concept has a distinct angle, source material and a clear reason to exist.</p><p class=\"ognote\">Check: relevant shares, profile visits and audience fit.</p></article><article class=\"ogcard\"><small>05 / IP IDEATION</small><h3>Build a series people recognize.</h3><p>I turn strong ideas into repeatable formats with a name, a hook pattern, visual cues and a next episode. Repetition becomes a system, not a copy-paste caption.</p><p class=\"ognote\">Check: return viewers, saves and series-level consistency.</p></article><article class=\"ogcard\"><small>06 / GROWTH SYSTEMS</small><h3>Connect content to the next step.</h3><p>I connect discovery, trust and action across Reels, carousels, Stories and broadcast. Content calendars include owners, production steps and tests, not just dates.</p><p class=\"ognote\">Check: reach \u2192 profile \u2192 follow \u2192 inquiry, with first-party data.</p></article></div><div class=\"ogchapter\"><h3 style=\"text-align:center\">SELECTED WORK / DOCUMENTED SNAPSHOTS</h3><div class=\"oggrid\"><article class=\"ogcard\"><strong>27K \u2192 103K</strong><p>Naveen Yadav / creator growth</p><a href=\"https://www.instagram.com/flicksandfunnys\" target=\"_blank\" rel=\"noreferrer\">View the work \u2197</a></article><article class=\"ogcard\"><strong>58.7K views</strong><p>Yash Garg / Manipal video I scripted</p><a href=\"https://youtu.be/ZVm2Nn70GhY\" target=\"_blank\" rel=\"noreferrer\">View the work \u2197</a></article><article class=\"ogcard\"><strong>2M views</strong><p>Yashita Singh / street-play series featured by Brut India</p><a href=\"https://www.instagram.com/reel/DPk66KpCWYs/\" target=\"_blank\" rel=\"noreferrer\">View the work \u2197</a></article><article class=\"ogcard\"><strong>+399.7% reach</strong><p>Paradox / +553.8% engagement, 15-member team</p></article><article class=\"ogcard\"><strong>2,000+ articles</strong><p>US-audience editorial work / 300K+ monthly visits</p></article><article class=\"ogcard\"><strong>20+ recommendations</strong><p>LinkedIn / feedback in the giver\u2019s own words</p><a href=\"https://www.linkedin.com/in/diya-nathwani6622\" target=\"_blank\" rel=\"noreferrer\">View the work \u2197</a></article></div><p class=\"ognote\">Figures are portfolio snapshots, not live counters or guaranteed results. The Yash Garg video was documented at 58.7K views and #1 for Manipal 2026 in the earlier capture; search rank changes by time and viewer. Paradox figures reflect the campaign reporting, not a current account dashboard. The 300K+ monthly figure describes publication traffic, not social reach.</p></div></section>";function mount(){const anchor=document.querySelector("#work");if(anchor&&!document.querySelector("#varun-strategy")){anchor.before(t.content.cloneNode(true));return true}return false}if(!mount()){const o=new MutationObserver(()=>{if(mount())o.disconnect()});o.observe(document.querySelector("#root"),{childList:true,subtree:true})}</script><script>function social40(){const hero=document.querySelector('.nk-hero-word.is-left');const social=document.querySelector('#social-strengths');const varun=document.querySelector('#varun-strategy');if(!hero||!social||!varun)return false;hero.textContent='Social Media';hero.setAttribute('aria-label','Social Media');const first=document.querySelector('#playground');first.before(social);social.after(varun);const legacy=document.querySelector('.legacy-l1');if(legacy)legacy.textContent='Social media starts with a reason to stop.';const n=document.createElement('section');n.className='social40-position';n.innerHTML='<h2>CONTENT PEOPLE RETURN TO.<br>STRATEGY THAT HAS A NEXT STEP.</h2><p class="social40-note">I build social media systems for creators, founders and brands: profile positioning, hooks, retention-led scripts, repeatable IPs, platform-native formats and a clear path from attention to action.</p><p class="social40-note">My approach draws on the public thinking of Tanmay Bhat and Alex Hormozi. The strategy and work here are mine, with no affiliation or claim to their results.</p><p class="social40-note">Social media leads this portfolio. Editorial, paid ads, websites and long-form writing stay in the mix as the skills that make the system work.</p>';social.before(n);const fav=document.createElement('section');fav.className='ognew';fav.id='favorite-profiles';fav.innerHTML='<span class="ogk">MY FAVORITE PROFILES / ORGANIZED BY FORMAT</span><h2>THE IPS I KEEP COMING BACK TO.</h2><p class="oglead">Not just a list of people. The formats, series and identity hooks I love, and what makes each memorable. These are references, not clients or collaborators.</p><h3>SERIES, SHOWS & SHORT-FORM STORYTELLING</h3><div class="oggrid"><article class="ogcard"><small>TRANSFORMATION SERIES</small><h3>The Rebel Kid / Saddie to Baddie</h3><p>The series I love: a named transformation arc, not unrelated uploads.</p><a href="https://www.youtube.com/@the.rebelkid" target="_blank" rel="noreferrer">Explore the reference ↗</a></article><article class="ogcard"><small>SHORT-FILM FORMAT</small><h3>Sejal Kumar / 1MinDrama</h3><p>One minute, one complete story. Acting, writing, music and direction become a repeatable format.</p><a href="https://www.instagram.com/sejalkumar1195/reel/DHqbgxzqmdh/" target="_blank" rel="noreferrer">Explore the reference ↗</a></article><article class="ogcard"><small>SHOW IP</small><h3>Samay Raina / India&#x27;s Got Latent</h3><p>A recurring show frame gives each episode a familiar identity.</p><a href="https://www.instagram.com/maisamayhoon/" target="_blank" rel="noreferrer">Explore the reference ↗</a></article><article class="ogcard"><small>EPISODIC MINI DRAMA</small><h3>@zoreverr</h3><p>The mini-drama series I love: a reason to return for the next story.</p><a href="https://www.instagram.com/zoreverr?stkn=MTA3eXB2bDNmYWpwcQ==" target="_blank" rel="noreferrer">Explore the reference ↗</a></article><article class="ogcard"><small>EPISODIC MINI DRAMA</small><h3>Dolly Singh / Best Worst Date</h3><p>Character-led micro drama turns short videos into a story series.</p><a href="https://creators.instagram.com/blog/introducing-instagram-rings?locale=en_US" target="_blank" rel="noreferrer">Explore the reference ↗</a></article></div><div class="ogchapter"><h3>IDENTITY HOOKS / WHAT MAKES YOU REMEMBER THEM</h3><div class="ogpair"><article class="ogcard"><small>FOUNDER IDENTITY</small><h3>Parul Gulati / Maalkin</h3><p>A signature word connects the person and Nish Hair. It is the identity I remember.</p><a href="https://www.instagram.com/gulati06/?hl=en" target="_blank">Explore profile ↗</a></article><article class="ogcard"><small>SIGN-OFF PATTERN</small><h3>“You know where to get it.”</h3><p>The recurring sign-off I noted: a familiar line can become a memory cue. Keep the wording consistent, but make the content worth remembering too.</p></article></div></div><div class="ogchapter"><h3>BROADCAST & COMMUNITY / A DIFFERENT KIND OF IP</h3><p>A recurring message, a recognizable ritual and a reason to return. In my Varun proposal, the existing channel gets a four-week return plan rather than another launch announcement.</p><a class="ogbutton" href="/social/varun-strategy-v39.html">Explore my broadcast strategy ↗</a></div>';varun.after(fav);return true}if(!social40()){const o40=new MutationObserver(()=>{if(social40())o40.disconnect()});o40.observe(document.querySelector('#root'),{childList:true,subtree:true})}</script><style>#favorite-profiles{padding:70px 4%;background:#7734f4!important;color:#fff}.photo49-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;max-width:1250px;margin:auto}.photo49-card{color:#17131c;border:2px solid #17131c;box-shadow:7px 7px #17131c}.photo49-card figure{margin:0;border:0;padding:0;background:#f6f1e7}.photo49-card img{display:block;width:100%;height:340px;object-fit:contain;background:#17131c}.photo49-card figcaption{font-size:12px;padding:10px 15px;color:#4b4355;line-height:1.5}.photo49-card>div{padding:25px}.photo49-card h3{font-size:30px!important;line-height:1.2}.photo49-card p{font-size:16px;line-height:1.7}.photo49-card small{font-size:12px;font-weight:bold}.photo49-card a{display:inline-block;border-bottom:2px solid #17131c;color:#17131c;text-decoration:none;font-weight:700;margin-top:10px;padding-bottom:4px}.tone0{background:#d8ff53}.tone1{background:#ffe32a}.tone2{background:#e1c8ff}.photo49-note{max-width:1000px;margin:28px auto!important;font-size:13px!important;line-height:1.6}@media(max-width:700px){#favorite-profiles{padding:45px 22px}.photo49-grid{grid-template-columns:1fr}.photo49-card img{height:300px}.photo49-card>div{padding:22px}.photo49-card h3{font-size:26px!important}}#favorite-profiles .photo49-card figure img{height:340px!important}@media(max-width:700px){#favorite-profiles .photo49-card figure img{height:300px!important}}</style><script>function photo49(){const f=d thod51-grid p{font-size:16px;line-height:1.7}.method51-example{background:#17131c;color:white;padding:20px;margin-top:20px}.method51-example b{font-size:12px;text-transform:uppercase}.method51-example p{color:#ffe534!important;margin-bottom:0}.method51-note{font-size:13px;max-width:1000px;margin:35px auto}@media(max-width:700px){.method51{padding:45px 22px}.method51-grid{grid-template-columns:1fr}.method51-grid article{padding:22px}.method51-grid h3{font-size:27px!important}}</style><script>function method51(){const a=document.querySelector(".social40-position");if(!a)return false;if(document.querySelector("#social-method"))return true;const t=document.createElement("template");t.innerHTML="<section class=\"ognew method51\" id=\"social-method\"><span class=\"ogk\">HOW I PLAN CONTENT</span><h2>MAKE PEOPLE CARE.<br>GIVE THEM A REASON TO RETURN.</h2><p class=\"oglead\">A clear point of view, a story worth following and a conversation that feels real. I start with what the person or business actually does, not a gimmick.</p><div class=\"method51-grid\"><article><small>01</small><h3>Create a series people recognise.</h3><p>Choose one question that can carry several episodes. Keep the setup familiar, but give each episode its own story. Start with two series, not eight.</p><div class=\"method51-example\"><b>For example</b><p>A founder explains one early decision each week: the first pitch, the first hire, the first mistake.</p></div></article><article><small>02</small><h3>Own a category.</h3><p>Find the subject the audience should connect with you. Carry it through your work, your stories and your visual choices. This is positioning, not a claim that you own the market.</p><div class=\"method51-example\"><b>For example</b><p>A hair business can show products, how people use them and a founder story that keeps returning to hair.</p></div></article><article><small>03</small><h3>Show how the work happens.</h3><p>The finished work is proof. The decisions behind it are the content: how you approach someone, shape a pitch, prepare a shoot or make a difficult choice.</p><div class=\"method51-example\"><b>For example</b><p>Show a cleared first message. Explain why you wrote it that way and what you would change.</p></div></article><article><small>04</small><h3>Treat hooks as content.</h3><p>Show two openings for the same story. Explain the difference. Let the audience choose before showing your pick.</p><div class=\"method51-example\"><b>For example</b><p>\u201cWe made a launch video.\u201d versus \u201cWhat did we need people to remember after ten seconds?\u201d</p></div></article><article><small>05</small><h3>Use contrast.</h3><p>One important line on a quiet background. One idea per frame. Black and white, or one colour block. If everything is highlighted, nothing stands out.</p><div class=\"method51-example\"><b>For example</b><p>Everyone sees the finished video. Show what happened before it.</p></div></article><article><small>06</small><h3>Try a different format.</h3><p>One person, two outfits, both sides of a hot take. Give each side a fair argument, explain the trade-off, then invite replies.</p><div class=\"method51-example\"><b>For example</b><p>\u201cAI makes creative work easier.\u201d / \u201cThen why does so much of it look the same?\u201d</p></div></article><article><small>07</small><h3>Make the first visit clear.</h3><p>The bio says who you are. Pins say where to start. Highlights answer questions. Series covers show the name and episode number.</p><div class=\"method51-example\"><b>For example</b><p>Introduction \u2192 real work example \u2192 first episode. Keep the next step easy to find.</p></div></article><article><small>08</small><h3>Build the relationship between posts.</h3><p>Use the existing broadcast channel for a rough thought, a small win or a decision in progress. Include people in updates. Set time each week to answer DMs, even with an emoji when that is enough.</p><div class=\"method51-example\"><b>For example</b><p>What are we making? What are we trying to get right? Ask people to choose a cover or suggest the next question.</p></div></article><article><small>09</small><h3>Give people something useful.</h3><p>Turn a real process into a checklist or template. Make the public link work before offering DM delivery. Do not require a like, share or follow to receive it.</p><div class=\"method51-example\"><b>For example</b><p>A pre-shoot checklist beside a video about planning a shoot. A useful question after someone asks for it.</p></div></article><article><small>10</small><h3>Test, then make the next version.</h3><p>Try an unconventional approach or a timely opinion when you have something real to say. Compare useful replies, saves, clicks and returns, not only views.</p><div class=\"method51-example\"><b>For example</b><p>What did people ask about? What brought them back? Use that to decide the next episode.</p></div></article></div><p class=\"method51-note\">These are ways I would plan and test content. Examples are editorial ideas, not published posts, client results or promises of reach.</p></section>";a.after(t.content);return true}if(!method51()){const o=new MutationObserver(()=>{if(method51())o.disconnect()});o.observe(document.querySelector("#root"),{childList:true,subtree:true})}</script><style>.method51-grid{display:block}.method51-grid article{position:relative;border:0;border-top:2px solid #17131c;box-shadow:none;background:none!important;display:grid;grid-template-columns:60px 1fr 1fr;gap:20px;padding:30px 0}.method51-grid article small{font-family:Antonio,sans-serif;font-size:40px;grid-row:1/3;color:#7734f4}.method51-grid article h3{margin:0;grid-column:2}.method51-grid article>p{grid-column:2;margin:0}.method51-example{grid-column:3;grid-row:1/3;margin:0;align-self:center;transform:rotate(-1deg);box-shadow:5px 5px #d8ff53}.method51-grid article:nth-child(even) .method51-example{background:#7734f4;transform:rotate(1deg);box-shadow:5px 5px #ffe32a}.method51-grid article:nth-child(3n) .method51-example{background:#d8ff53;color:#17131c}.method51-grid article:nth-child(3n) .method51-example p{color:#17131c!important}.method51-grid h3{font-family:Antonio,sans-serif}.method51 h2{max-width:1150px}#social-version52{font-size:12px;letter-spacing:.1em;padding:15px 4%;border-top:2px solid #17131c;background:#d8ff53}#favorite-profiles .ogk{color:#ffe32a}.photo49-card figcaption a{font-size:12px!important;margin:0!important} @media(max-width:700px){.method51-grid article{grid-template-columns:36px 1fr;gap:12px}.method51-grid article small{font-size:28px}.method51-example{grid-column:2;grid-row:auto;margin-top:10px;transform:none!important}.method51-grid h3{font-size:26px!important}.method51-grid article>p{grid-column:2}}</style><script>function fix52(){const f=document.querySelector('#favorite-profiles');if(!f)return false;document.querySelectorAll('a[href="/social/varun-strategy-v39.html"]').forEach(a=>a.href='/social/varun/');if(!document.querySelector('#social-version52')){const v=document.createElement('div');v.id='social-version52';v.textContent='V52 / SOCIAL - METHODS & REFERENCES / OCTOBER 2026';document.querySelector('main').append(v)}return true}if(!fix52()){const ob=new MutationObserver(()=>{if(fix52())ob.disconnect()});ob.observe(document.querySelector('#root'),{childList:true,subtree:true})}</script><style>#social-strengths .work53-has-shot{position:relative;overflow:hidden;isolation:isolate;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff!important;background:#17131c!important} .work53-shot{position:absolute;inset:0;margin:0!important;z-index:-1}.work53-shot img{width:100%!important;height:100%!important;object-fit:cover;object-position:top;filter:brightness(.44)}.work53-shot figcaption{position:absolute;top:8px;left:8px;right:8px;font-size:10px;line-height:1.4;background:#17131c;color:white;padding:7px}.work53-has-shot strong{color:#d8ff53!important;text-shadow:1px 2px #17131c}.work53-has-shot p,.work53-has-shot a{color:white!important;text-shadow:1px 2px #17131c}.work53-has-shot a{background:#17131c;border:1px solid white;padding:10px}.work53-has-shot{padding-top:100px!important}</style><script>function update53(){const a=document.querySelector('#about .chat1');const section=document.querySelector('#social-strengths');if(!a||!section)return false;a.innerHTML="<p>Hi, I'm <b>Diya</b>. I work on the strategy behind what people stop for, watch and come back to.</p><p>I studied <b>data science at IIT Madras</b>, so yes, I will ask what your CTR is. I'll also ask why someone would care about the next post.</p><p>I help <b>founders, brands and creators</b> connect:</p><div class=\"flow\"><span>who you're for</span><i>\u2192</i><span>why people stay</span><i>\u2192</i><span>what they do next</span></div><p>A profile should make sense on the first visit. A hook should earn attention. A script should keep its promise. A series should give people a reason to return.</p><p>I work on <b>positioning, hooks, retention-led scripts, repeatable series and content plans</b>. Then I look at what people watched, saved, replied to or clicked, and use it to plan the next version.</p><p><b>Stories are still the whole job.</b> The plot, the dialogue, the bit where the audience can't look away. My editorial, brand and campaign work is what I bring to social, not a separate personality.</p><p class=\"last\">Also: I love breaking down <b>contradictory topics</b> and I talk like I'm hosting a podcast. It probably explains the scripts.</p>";const cards=section.querySelectorAll('.ogchapter .oggrid .ogcard');const images={"1": {"src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gIoSUNDX1BST0ZJTEUAAQEAAAIYAAAAAAQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAAHRyWFlaAAABZAAAABRnWFlaAAABeAAAABRiWFlaAAABjAAAABRyVFJDAAABoAAAAChnVFJDAAABoAAAA
