on</h3><p>I align the name field, bio, proof, pins, Highlights and link path so a first-time visitor knows who the account is for and why to stay.</p><p class=\"ognote\">Check: profile visits \u2192 follows \u2192 relevant link taps.</p></article><article class=\"ogcard\"><small>02 / HOOK ARCHITECTURE</small><h3>Earn the first few seconds.</h3><p>I build hooks around a specific question, a useful contradiction or a real scene. The opening promises one payoff, not five unrelated ideas.</p><p class=\"ognote\">Check: first-seconds retention and matched hook tests.</p></article><article class=\"ogcard\"><small>03 / RETENTION SCRIPTWRITING</small><h3>Keep the promise moving.</h3><p>I sequence setup, tension, evidence and payoff. Cut filler, use purposeful pattern changes and give each line a reason to lead to the next.</p><p class=\"ognote\">Check: audience drop-offs, average watch time and completion.</p></article><article class=\"ogcard\"><small>04 / TREND-ADAPTIVE CONCEPTS</small><h3>Use the trend. Keep the voice.</h3><p>I adapt a live format to the creator\u2019s actual expertise and audience. The concept has a distinct angle, source material and a clear reason to exist.</p><p class=\"ognote\">Check: relevant shares, profile visits and audience fit.</p></article><article class=\"ogcard\"><small>05 / IP IDEATION</small><h3>Build a series people recognize.</h3><p>I turn strong ideas into repeatable formats with a name, a hook pattern, visual cues and a next episode. Repetition becomes a system, not a copy-paste caption.</p><p class=\"ognote\">Check: return viewers, saves and series-level consistency.</p></article><article class=\"ogcard\"><small>06 / GROWTH SYSTEMS</small><h3>Connect content to the next step.</h3><p>I connect discovery, trust and action across Reels, carousels, Stories and broadcast. Content calendars include owners, production steps and tests, not just dates.</p><p class=\"ognote\">Check: reach \u2192 profile \u2192 follow \u2192 inquiry, with first-party data.</p></article></div><div class=\"ogchapter\"><h3 style=\"text-align:center\">SELECTED WORK / DOCUMENTED SNAPSHOTS</h3><div class=\"oggrid\"><article class=\"ogcard\"><strong>27K \u2192 103K</strong><p>Naveen Yadav / creator growth</p><a href=\"https://www.instagram.com/flicksandfunnys\" target=\"_blank\" rel=\"noreferrer\">View the work \u2197</a></article><article class=\"ogcard\"><strong>58.7K views</strong><p>Yash Garg / Manipal video I scripted</p><a href=\"https://youtu.be/ZVm2Nn70GhY\" target=\"_blank\" rel=\"noreferrer\">View the work \u2197</a></article><article class=\"ogcard\"><strong>2M views</strong><p>Yashita Singh / street-play series featured by Brut India</p><a href=\"https://www.instagram.com/reel/DPk66KpCWYs/\" target=\"_blank\" rel=\"noreferrer\">View the work \u2197</a></article><article class=\"ogcard\"><strong>+399.7% reach</strong><p>Paradox / +553.8% engagement, 15-member team</p></article><article class=\"ogcard\"><strong>2,000+ articles</strong><p>US-audience editorial work / 300K+ monthly visits</p></article><article class=\"ogcard\"><strong>20+ recommendations</strong><p>LinkedIn / feedback in the giver\u2019s own words</p><a href=\"https://www.linkedin.com/in/diya-nathwani6622\" target=\"_blank\" rel=\"noreferrer\">View the work \u2197</a></article></div><p class=\"ognote\">Figures are portfolio snapshots, not live counters or guaranteed results. The Yash Garg video was documented at 58.7K views and #1 for Manipal 2026 in the earlier capture; search rank changes by time and viewer. Paradox figures reflect the campaign reporting, not a current account dashboard. The 300K+ monthly figure describes publication traffic, not social reach.</p></div></section>";function mount(){const anchor=document.querySelector("#work");if(anchor&&!document.querySelector("#varun-strategy")){anchor.before(t.content.cloneNode(true));return true}return false}if(!mount()){const o=new MutationObserver(()=>{if(mount())o.disconnect()});o.observe(document.querySelector("#root"),{childList:true,subtree:true})}</script><script>function social40(){const hero=document.querySelector('.nk-hero-word.is-left');const social=document.querySelector('#social-strengths');const varun=document.querySelector('#varun-strategy');if(!hero||!social||!varun)return false;hero.textContent='Social Media';hero.setAttribute('aria-label','Social Media');const first=document.querySelector('#playground');first.before(social);social.after(varun);const legacy=document.querySelector('.legacy-l1');if(legacy)legacy.textContent='Social media starts with a reason to stop.';const n=document.createElement('section');n.className='social40-position';n.innerHTML='<h2>CONTENT PEOPLE RETURN TO.<br>STRATEGY THAT HAS A NEXT STEP.</h2><p class="social40-note">I build social media systems for creators, founders and brands: profile positioning, hooks, retention-led scripts, repeatable IPs, platform-native formats and a clear path from attention to action.</p><p class="social40-note">My approach draws on the public thinking of Tanmay Bhat and Alex Hormozi. The strategy and work here are mine, with no affiliation or claim to their results.</p><p class="social40-note">Social media leads this portfolio. Editorial, paid ads, websites and long-form writing stay in the mix as the skills that make the system work.</p>';social.before(n);const fav=document.createElement('section');fav.className='ognew';fav.id='favorite-profiles';fav.innerHTML='<span class="ogk">MY FAVORITE PROFILES / ORGANIZED BY FORMAT</span><h2>THE IPS I KEEP COMING BACK TO.</h2><p class="oglead">Not just a list of people. The formats, series and identity hooks I love, and what makes each memorable. These are references, not clients or collaborators.</p><h3>SERIES, SHOWS & SHORT-FORM STORYTELLING</h3><div class="oggrid"><article class="ogcard"><small>TRANSFORMATION SERIES</small><h3>The Rebel Kid / Saddie to Baddie</h3><p>The series I love: a named transformation arc, not unrelated uploads.</p><a href="https://www.youtube.com/@the.rebelkid" target="_blank" rel="noreferrer">Explore the reference ↗</a></article><article class="ogcard"><small>SHORT-FILM FORMAT</small><h3>Sejal Kumar / 1MinDrama</h3><p>One minute, one complete story. Acting, writing, music and direction become a repeatable format.</p><a href="https://www.instagram.com/sejalkumar1195/reel/DHqbgxzqmdh/" target="_blank" rel="noreferrer">Explore the reference ↗</a></article><article class="ogcard"><small>SHOW IP</small><h3>Samay Raina / India&#x27;s Got Latent</h3><p>A recurring show frame gives each episode a familiar identity.</p><a href="https://www.instagram.com/maisamayhoon/" target="_blank" rel="noreferrer">Explore the reference ↗</a></article><article class="ogcard"><small>EPISODIC MINI DRAMA</small><h3>@zoreverr</h3><p>The mini-drama series I love: a reason to return for the next story.</p><a href="https://www.instagram.com/zoreverr?stkn=MTA3eXB2bDNmYWpwcQ==" target="_blank" rel="noreferrer">Explore the reference ↗</a></article><article class="ogcard"><small>EPISODIC MINI DRAMA</small><h3>Dolly Singh / Best Worst Date</h3><p>Character-led micro drama turns short videos into a story series.</p><a href="https://creators.instagram.com/blog/introducing-instagram-rings?locale=en_US" target="_blank" rel="noreferrer">Explore the reference ↗</a></article></div><div class="ogchapter"><h3>IDENTITY HOOKS / WHAT MAKES YOU REMEMBER THEM</h3><div class="ogpair"><article class="ogcard"><small>FOUNDER IDENTITY</small><h3>Parul Gulati / Maalkin</h3><p>A signature word connects the person and Nish Hair. It is the identity I remember.</p><a href="https://www.instagram.com/gulati06/?hl=en" target="_blank">Explore profile ↗</a></article><article class="ogcard"><small>SIGN-OFF PATTERN</small><h3>“You know where to get it.”</h3><p>The recurring sign-off I noted: a familiar line can become a memory cue. Keep the wording consistent, but make the content worth remembering too.</p></article></div></div><div class="ogchapter">< he original work \u2197</a></div><p class=\"ognote\">Quick format-led edition. Dated screenshots are work samples, not live counters. Personal Instagram posts visible only through a signed-in session have not been copied here. Varun mockups are unpublished; creator voice, facts and rights need review before use.</p></section>";a.before(t.content);return true}if(!own41()){const o=new MutationObserver(()=>{if(own41())o.disconnect()});o.observe(document.querySelector("#root"),{childList:true,subtree:true})}</script><style>.workflow43{background:#f1eadc!important}.workflow-rail{border-top:3px solid #161219}.workflow-rail article{display:grid;grid-template-columns:110px 1fr;gap:28px;padding:32px 0;border-bottom:2px solid #161219}.workflow-num{font-family:Antonio,sans-serif;font-size:78px;line-height:1;color:#7334ff}.workflow-rail article:nth-child(even){padding-left:12%;background:#e4d1ff}.workflow-rail article:nth-child(4){background:#d8ff4a}.workflow-rail article:nth-child(7){background:#ffe32a}.workflow-rail small{font-weight:800;letter-spacing:.06em}.workflow-rail h3{font-size:27px;margin:10px 0}.workflow-rail p{max-width:820px;line-height:1.65}@media(max-width:600px){.workflow-rail article{grid-template-columns:46px 1fr;gap:15px;padding:25px 10px!important}.workflow-num{font-size:48px}.workflow-rail h3{font-size:23px}}</style><script>function workflow43(){const a=document.querySelector("#social-strengths");if(!a)return false;if(document.querySelector("#social-workflow"))return true;const t=document.createElement("template");t.innerHTML="<section class=\"ognew workflow43\" id=\"social-workflow\"><span class=\"ogk\">END-TO-END / SOCIAL MEDIA STRATEGY + EXECUTION</span><h2>FROM THE AUDIT.<br>TO THE NEXT ITERATION.</h2><p class=\"oglead\">Audit \u2192 analysis \u2192 strategy \u2192 IP development \u2192 moment marketing \u2192 team leadership \u2192 analytics-driven iteration. One connected workflow, not seven isolated services.</p><div class=\"workflow-rail\"><article><span class=\"workflow-num\">01</span><div><small>SOCIAL MEDIA AUDIT</small><h3>Start with the account, not assumptions.</h3><p>Profile and search visibility. Content mix. Hooks. Retention. Community signals. A dated baseline of what is working and what needs attention.</p></div></article><article><span class=\"workflow-num\">02</span><div><small>CONTENT + AUDIENCE ANALYSIS</small><h3>Turn the numbers into a useful diagnosis.</h3><p>Compare formats, topics and audience response. Separate reach from relevant interest. Find the recurring patterns worth testing, without pretending a correlation proves the cause.</p></div></article><article><span class=\"workflow-num\">03</span><div><small>SOCIAL MEDIA STRATEGY</small><h3>Give every format a job.</h3><p>Positioning, audience segments, content pillars, platform roles and the path from discovery to trust to action. Build an editorial direction the team can actually use.</p></div></article><article><span class=\"workflow-num\">04</span><div><small>IP DEVELOPMENT</small><h3>Make the next episode recognizable.</h3><p>Create recurring series with a name, a hook pattern, visual cues and a clear promise. Write the episode bank, format rules and platform-native scripts that make the idea repeatable.</p></div></article><article><span class=\"workflow-num\">05</span><div><small>MOMENT MARKETING</small><h3>Meet the moment. Keep the brand.</h3><p>Adapt timely conversations and trend formats to the audience and the account's voice. A relevant angle first, a production-ready concept next. No trend for the sake of a trend.</p></div></article><article><span class=\"workflow-num\">06</span><div><small>CREATIVE TEAM LEADERSHIP</small><h3>Get the idea through production.</h3><p>Translate strategy into briefs, scripts, owners, calendars and review checkpoints. Align writers, designers and editors so the work keeps its idea from first draft to final post.</p></div></article><article><span class=\"workflow-num\">07</span><div><small>ANALYTICS-DRIVEN ITERATION</small><h3>Post. Read the signal. Make the next one better.</h3><p>Review retention, completion, saves and shares per reach, profile conversion and relevant inquiries. Test hooks and formats, record the learning, then change the next brief.</p></div></article></div><p class=\"ognote\">Selected proof below: creator work, retention-led scripts, format-led concepts and Paradox campaign reporting with a 15-member team. Past snapshots are evidence of the work, not guaranteed future results.</p></section>";a.before(t.content);document.querySelectorAll("a[href=\"varun-strategy-v39.html\"]").forEach(x=>x.href="social/varun/");return true}if(!workflow43()){const o=new MutationObserver(()=>{if(workflow43())o.disconnect()});o.observe(document.querySelector("#root"),{childList:true,subtree:true})}</script></body></html>
