igcaption><b>THE TREATMENT</b> / A proposed bio and positioning screen. Camera, founder, books and film in one story.</figcaption></figure></div><div class=\"oglinks\"><a class=\"ogbutton\" href=\"varun-strategy-v39.html\">Explore the full case study \u2197</a></div><div class=\"oggrid\"><article class=\"ogcard\"><small>01 / PERCEPTION AUDIT</small><h3>Make the proof easy to find.</h3><p>Bio and search positioning | first-screen hierarchy | existing pins | new Highlight concepts.</p></article><article class=\"ogcard\"><small>02 / GROWTH ENGINE</small><h3>Give each format a job.</h3><p>Seven distinct carousel treatments | six Reel series | question hooks | captions | CTAs | broadcast examples.</p></article><article class=\"ogcard\"><small>03 / EXECUTION LAYER</small><h3>Test before scaling.</h3><p>Profile visit to follow | retention | saves and shares per reach | channel return | first-party baseline.</p></article></div><p class=\"ognote\">April 2026: original 53-page, three-volume strategy. September 2026: screenshot-led revision and unpublished mockups. This is strategy work, not a claim that Varun implemented it or that his account grew because of it.</p></section><section class=\"ognew\" id=\"social-strengths\"><span class=\"ogk\">SOCIAL MEDIA / WHAT I OPTIMIZE & HOW</span><h2>THE NUMBERS.<br>THE WORK BEHIND THEM.</h2><p class=\"oglead\">From a profile\u2019s first impression to a script\u2019s last line. I work on the parts that decide whether someone stops, stays, follows or takes the next step.</p><div class=\"oggrid\"><article class=\"ogcard\"><small>01 / FIRST IMPRESSION</small><h3>Profile &amp; search optimization</h3><p>I align the name field, bio, proof, pins, Highlights and link path so a first-time visitor knows who the account is for and why to stay.</p><p class=\"ognote\">Check: profile visits \u2192 follows \u2192 relevant link taps.</p></article><article class=\"ogcard\"><small>02 / HOOK ARCHITECTURE</small><h3>Earn the first few seconds.</h3><p>I build hooks around a specific question, a useful contradiction or a real scene. The opening promises one payoff, not five unrelated ideas.</p><p class=\"ognote\">Check: first-seconds retention and matched hook tests.</p></article><article class=\"ogcard\"><small>03 / RETENTION SCRIPTWRITING</small><h3>Keep the promise moving.</h3><p>I sequence setup, tension, evidence and payoff. Cut filler, use purposeful pattern changes and give each line a reason to lead to the next.</p><p class=\"ognote\">Check: audience drop-offs, average watch time and completion.</p></article><article class=\"ogcard\"><small>04 / TREND-ADAPTIVE CONCEPTS</small><h3>Use the trend. Keep the voice.</h3><p>I adapt a live format to the creator\u2019s actual expertise and audience. The concept has a distinct angle, source material and a clear reason to exist.</p><p class=\"ognote\">Check: relevant shares, profile visits and audience fit.</p></article><article class=\"ogcard\"><small>05 / IP IDEATION</small><h3>Build a series people recognize.</h3><p>I turn strong ideas into repeatable formats with a name, a hook pattern, visual cues and a next episode. Repetition becomes a system, not a copy-paste caption.</p><p class=\"ognote\">Check: return viewers, saves and series-level consistency.</p></article><article class=\"ogcard\"><small>06 / GROWTH SYSTEMS</small><h3>Connect content to the next step.</h3><p>I connect discovery, trust and action across Reels, carousels, Stories and broadcast. Content calendars include owners, production steps and tests, not just dates.</p><p class=\"ognote\">Check: reach \u2192 profile \u2192 follow \u2192 inquiry, with first-party data.</p></article></div><div class=\"ogchapter\"><h3 style=\"text-align:center\">SELECTED WORK / DOCUMENTED SNAPSHOTS</h3><div class=\"oggrid\"><article class=\"ogcard\"><strong>27K \u2192 103K</strong><p>Naveen Yadav / creator growth</p><a href=\"https://www.instagram.com/flicksandfunnys\" target=\"_blank\" rel=\"noreferrer\">View the work \u2197</a></article><article class=\"ogcard\"><strong>58.7K views</strong><p>Yash Garg / Manipal video I scripted</p><a href=\"https://youtu.be/ZVm2Nn70GhY\" target=\"_blank\" rel=\"noreferrer\">View the work \u2197</a></article><article class=\"ogcard\"><strong>2M views</strong><p>Yashita Singh / street-play series featured by Brut India</p><a href=\"https://www.instagram.com/reel/DPk66KpCWYs/\" target=\"_blank\" rel=\"noreferrer\">View the work \u2197</a></article><article class=\"ogcard\"><strong>+399.7% reach</strong><p>Paradox / +553.8% engagement, 15-member team</p></article><article class=\"ogcard\"><strong>2,000+ articles</strong><p>US-audience editorial work / 300K+ monthly visits</p></article><article class=\"ogcard\"><strong>20+ recommendations</strong><p>LinkedIn / feedback in the giver\u2019s own words</p><a href=\"https://www.linkedin.com/in/diya-nathwani6622\" target=\"_blank\" rel=\"noreferrer\">View the work \u2197</a></article></div><p class=\"ognote\">Figures are portfolio snapshots, not live counters or guaranteed results. The Yash Garg video was documented at 58.7K views and #1 for Manipal 2026 in the earlier capture; search rank changes by time and viewer. Paradox figures reflect the campaign reporting, not a current account dashboard. The 300K+ monthly figure describes publication traffic, not social reach.</p></div></section>";function mount(){const anchor=document.querySelector("#work");if(anchor&&!document.querySelector("#varun-strategy")){anchor.before(t.content.cloneNode(true));return true}return false}if(!mount()){const o=new MutationObserver(()=>{if(mount())o.disconnect()});o.observe(document.querySelector("#root"),{childList:true,subtree:true})}</script></body>
